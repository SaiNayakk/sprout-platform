# Pre-prod: an environment created fresh for every release, tested end to end, then destroyed.
# It mirrors the phone: the same host jar, JVM flags, memory budget and Postgres major version.
#
#   ./preprod/run.sh            create, test (e2e, perf, chaos), record evidence, destroy
#   docker compose -f preprod/docker-compose.yml --profile observability up -d   to explore by hand
#
# Every secret below is a throwaway value for this disposable environment only.
name: sprout-preprod

services:
  postgres:
    image: postgres:18-alpine          # the phone runs PostgreSQL 18.6
    environment:
      POSTGRES_DB: sprout
      POSTGRES_USER: sprout
      POSTGRES_PASSWORD: preprod-only-not-a-secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprout -d sprout"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  # Events between services. Small and single-binary, like on the phone.
  nats:
    image: nats:2.10-alpine
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 64m

  edge:
    build:
      context: ..
      dockerfile: preprod/Dockerfile.host
      args:
        HOST: edge
        XMX: 160m
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=identity
      IDENTITY_DB_USER: sprout
      IDENTITY_DB_PASSWORD: preprod-only-not-a-secret
      IDENTITY_TOTP_KEY: cHJlcHJvZC1vbmx5LTMyLWJ5dGUtdGVzdC1rZXkhISE=
      # like the phone: the signing key comes from a file (run.sh makes a throwaway one per run)
      IDENTITY_SIGNING_KEY_PATH: /keys/signing.pem
      IDENTITY_BIND: 0.0.0.0
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_IDENTITY_URL: http://127.0.0.1:8101
      GATEWAY_JWKS_URL: http://127.0.0.1:8101/.well-known/jwks.json
      GATEWAY_MARKETDATA_URL: http://trading:8103
      GATEWAY_ACCOUNTS_URL: http://money:8104
      GATEWAY_PAYMENTS_URL: http://money:8105
      GATEWAY_BANK_URL: http://street:8107
      GATEWAY_OMS_URL: http://trading:8109
      GATEWAY_STATEMENTS_URL: http://money:8113
      EDGE_WARMUP_SIGNINS: ${EDGE_WARMUP_SIGNINS:-300}
      # pre-prod sits behind the test runner the way prod sits behind Cloudflare
      GATEWAY_TRUST_CF_IP: "true"
      LOG_FORMAT: ecs
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 10s   # pre-prod runs are short; one point a minute is too coarse
      # latency percentiles on the dashboard need histogram buckets, off by default to save memory
      SPRING_APPLICATION_JSON: '{"management.metrics.distribution.percentiles-histogram.http.server.requests": true}'
      OTEL_METRICS_URL: http://lgtm:4318/v1/metrics
      OTEL_TRACES_URL: http://lgtm:4318/v1/traces
    volumes:
      - ./out/keys:/keys:ro
    ports:
      - "8100:8100"
    mem_limit: 384m                     # the phone's budget for this host
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8190/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8101/actuator/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s

  # The trading host: market data and orders (with their risk checks). A separate JVM, so its faults
  # can't take sign-in down (CHAOS-03).
  trading:
    build:
      context: ..
      dockerfile: preprod/Dockerfile.host
      args:
        HOST: trading
        XMX: 160m
    environment:
      MARKETDATA_BIND: 0.0.0.0
      OMS_BIND: 0.0.0.0
      OMS_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=oms
      OMS_DB_PASSWORD: preprod-only-not-a-secret
      OMS_ACCOUNTS_URL: http://money:8104
      OMS_LEDGER_URL: http://money:8106
      OMS_EXCHANGE_URL: http://street:8108
      OMS_RMS_EVERY: 1s
      SPROUT_SERVICE_KEY: preprod-only-service-key
      EXCHANGE_SPROUT_MEMBER_KEY: preprod-only-member-key
      EXCHANGE_SPROUT_WEBHOOK_SECRET: preprod-only-exchange-webhook-secret
      # accelerated so a full session (and the close, and the next day) fits in a pre-prod run
      MARKETDATA_CLOCK: ACCELERATED
      MARKETDATA_SPEED: ${MARKETDATA_SPEED:-30}
      MARKETDATA_NATS_URL: nats://nats:4222
      LOG_FORMAT: ecs
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 10s
      OTEL_METRICS_URL: http://lgtm:4318/v1/metrics
      OTEL_TRACES_URL: http://lgtm:4318/v1/traces
    mem_limit: 320m                     # the phone's budget for this host
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8103/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8109/actuator/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s

  # The money host: ledger, accounts, payments, settlement, statements and reconciliation. Throwaway secrets, shared with the street host
  # where the two must agree (the bank partner key and the callback signing secret).
  money:
    build:
      context: ..
      dockerfile: preprod/Dockerfile.host
      args:
        HOST: money
        XMX: 160m
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=ledger
      ACCOUNTS_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=accounts
      PAYMENTS_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=payments
      LEDGER_DB_PASSWORD: preprod-only-not-a-secret
      ACCOUNTS_DB_PASSWORD: preprod-only-not-a-secret
      PAYMENTS_DB_PASSWORD: preprod-only-not-a-secret
      LEDGER_BIND: 0.0.0.0
      ACCOUNTS_BIND: 0.0.0.0
      PAYMENTS_BIND: 0.0.0.0
      ACCOUNTS_BANK_URL: http://street:8107
      ACCOUNTS_PAN_PEPPER: preprod-only-pan-pepper
      ACCOUNTS_DEPOSITORY_URL: http://street:8111
      ACCOUNTS_CLEARING_URL: http://street:8110
      DEPOSITORY_SPROUT_PARTICIPANT_KEY: preprod-only-participant-key
      CLEARING_SPROUT_MEMBER_KEY: preprod-only-clearing-member-key
      SETTLEMENT_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=settlement
      SETTLEMENT_DB_PASSWORD: preprod-only-not-a-secret
      SETTLEMENT_BIND: 0.0.0.0
      SETTLEMENT_OMS_URL: http://trading:8109
      SETTLEMENT_BANK_URL: http://street:8107
      SETTLEMENT_EVERY: 2s
      STATEMENTS_BIND: 0.0.0.0
      STATEMENTS_MARKETDATA_URL: http://trading:8103
      STATEMENTS_OMS_URL: http://trading:8109
      STATEMENTS_DEPOSITORY_URL: http://street:8111
      RECON_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=recon
      RECON_DB_PASSWORD: preprod-only-not-a-secret
      RECON_BIND: 0.0.0.0
      RECON_CHECK_EVERY: 10s
      RECON_MARKETDATA_URL: http://trading:8103
      RECON_OMS_URL: http://trading:8109
      RECON_BANK_URL: http://street:8107
      RECON_EXCHANGE_URL: http://street:8108
      RECON_DEPOSITORY_URL: http://street:8111
      EXCHANGE_SPROUT_MEMBER_KEY: preprod-only-member-key
      CLEARING_SPROUT_WEBHOOK_SECRET: preprod-only-clearing-webhook-secret
      PAYMENTS_ACCOUNTS_URL: http://127.0.0.1:8104
      PAYMENTS_LEDGER_URL: http://127.0.0.1:8106
      PAYMENTS_BANK_URL: http://street:8107
      PAYMENTS_CALLBACK_URL: http://money:8105/internal/v1/bank-events
      PAYMENTS_RECONCILE_EVERY: 5s
      SPROUT_SERVICE_KEY: preprod-only-service-key
      BANK_SPROUT_PARTNER_KEY: preprod-only-partner-key
      BANK_SPROUT_WEBHOOK_SECRET: preprod-only-webhook-secret
      LOG_FORMAT: ecs
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 10s
      OTEL_METRICS_URL: http://lgtm:4318/v1/metrics
      OTEL_TRACES_URL: http://lgtm:4318/v1/traces
    mem_limit: 320m                     # the phone's budget for this host
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8106/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8104/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8105/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8112/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8113/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8114/actuator/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s

  # The street host: Sprout Bank, the exchange, the depository and the clearing corporation (the outside
  # world, simulated).
  street:
    build:
      context: ..
      dockerfile: preprod/Dockerfile.host
      args:
        HOST: street
        XMX: 160m
    environment:
      BANK_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=bank
      BANK_DB_PASSWORD: preprod-only-not-a-secret
      BANK_BIND: 0.0.0.0
      BANK_COLLECT_TTL: 30s             # short, so E2E can watch a request expire
      BANK_SPROUT_PARTNER_KEY: preprod-only-partner-key
      BANK_SPROUT_WEBHOOK_SECRET: preprod-only-webhook-secret
      EXCHANGE_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=exchange
      EXCHANGE_DB_PASSWORD: preprod-only-not-a-secret
      EXCHANGE_BIND: 0.0.0.0
      EXCHANGE_MARKETDATA_URL: http://trading:8103
      EXCHANGE_SPROUT_MEMBER_KEY: preprod-only-member-key
      EXCHANGE_SPROUT_WEBHOOK_SECRET: preprod-only-exchange-webhook-secret
      EXCHANGE_SPROUT_CALLBACK_URL: http://trading:8109/internal/v1/exchange-events
      EXCHANGE_CLEARING_KEY: preprod-only-exchange-clearing-key
      BANK_CLEARING_PARTNER_KEY: preprod-only-clearing-partner-key
      BANK_CLEARING_WEBHOOK_SECRET: preprod-only-clearing-bank-webhook-secret
      DEPOSITORY_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=depository
      DEPOSITORY_DB_PASSWORD: preprod-only-not-a-secret
      DEPOSITORY_BIND: 0.0.0.0
      DEPOSITORY_SPROUT_PARTICIPANT_KEY: preprod-only-participant-key
      DEPOSITORY_CLEARING_KEY: preprod-only-depository-clearing-key
      CLEARING_DB_URL: jdbc:postgresql://postgres:5432/sprout?currentSchema=clearing
      CLEARING_DB_PASSWORD: preprod-only-not-a-secret
      CLEARING_BIND: 0.0.0.0
      CLEARING_MARKETDATA_URL: http://trading:8103
      CLEARING_SETTLE_EVERY: 2s
      CLEARING_SPROUT_MEMBER_KEY: preprod-only-clearing-member-key
      CLEARING_SPROUT_WEBHOOK_SECRET: preprod-only-clearing-webhook-secret
      CLEARING_SPROUT_CALLBACK_URL: http://money:8112/internal/v1/clearing-events
      LOG_FORMAT: ecs
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 10s
      OTEL_METRICS_URL: http://lgtm:4318/v1/metrics
      OTEL_TRACES_URL: http://lgtm:4318/v1/traces
    mem_limit: 320m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8107/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8108/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8111/actuator/health >/dev/null && wget -qO- http://127.0.0.1:8110/actuator/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s

  # Grafana, Prometheus, Loki and Tempo in one container. Optional: about 1 GB of RAM.
  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "3000:3000"
      - "4318:4318"
    mem_limit: 1536m

  k6:
    image: grafana/k6:2.3.0
    profiles: ["tools"]
    working_dir: /scripts               # scripts are passed by name, so no host path is ever converted
    volumes:
      - ./k6:/scripts:ro
      - ./out:/out
    environment:
      BASE_URL: http://edge:8100

  # Java load generator for tests k6 can't express (long-lived price streams). It runs inside the
  # network so it reads the same clock as the services: delivery latency compares the tick's
  # emittedAt with the moment it arrives, and two machines' clocks would differ by more than that.
  loadgen:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /tmp
    volumes:
      - ../e2e:/e2e:ro
      - ./out:/out
      - ${M2_REPO:-~/.m2}:/root/.m2
    environment:
      MAVEN_ARGS: --no-transfer-progress
      PERF_OUT: /out/perf-03-summary.json
    entrypoint: ["sh", "-c", "cp -r /e2e /tmp/e2e && rm -rf /tmp/e2e/target && exec mvn -q -B -f /tmp/e2e/pom.xml test -Dsprout.baseUrl=http://edge:8100 \"$$@\"", "loadgen"]
