name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Build the services at the releases the manifests pin
        run: hosts/install-services.sh
      - name: Build the hosts
        run: |
          mvn -B -f hosts/edge/pom.xml package
          mvn -B -f hosts/trading/pom.xml package
      - name: Compile the end-to-end suite
        run: mvn -B -f e2e/pom.xml test-compile
      - name: Check scripts
        run: |
          bash -n preprod/run.sh
          bash -n hosts/install-services.sh
          python -m py_compile preprod/report.py preprod/chaos.py
      - name: Build the docs (broken links fail)
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

  preprod:
    # The release gate: a fresh environment, every test, evidence, then destroyed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: "Pre-prod: create, end-to-end, performance, chaos, destroy"
        run: preprod/run.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprod-evidence
          path: |
            docs/reliability/runs/
            preprod/out/
          retention-days: 30
