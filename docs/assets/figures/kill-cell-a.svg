<text class="in dim" x="561.8" y="112">out</text>
<rect class="switching" x="662.4" y="96" width="48.1" height="24" rx="4"><title>switching over: +876 s to +964 s</title></rect>
<rect class="own" x="712.5" y="96" width="22.5" height="24" rx="4"><title>its own customers: +964 s to +1007 s</title></rect>
<text class="lab" x="118" y="150" text-anchor="end">Region B (laptop)</text>
