<text class="tick" x="504.1" y="178" text-anchor="middle">+10 min</text>
<line class="grid" x1="572.5" x2="572.5" y1="92" y2="158"/>
<text class="tick" x="572.5" y="178" text-anchor="middle">+12 min</text>
<line class="grid" x1="640.8" x2="640.8" y1="92" y2="158"/>
<text class="tick" x="640.8" y="178" text-anchor="middle">+14 min</text>
<line class="grid" x1="709.2" x2="709.2" y1="92" y2="158"/>
<text class="tick" x="709.2" y="178" text-anchor="middle">+16 min</text>
<line class="axis" x1="128" x2="736" y1="164" y2="164"/>
<text class="lab" x="118" y="112" text-anchor="end">Region A (phone)</text>
<rect class="own" x="129.0" y="96" width="32.2" height="24" rx="4"><title>its own customers: -60 s to +0 s</title></rect>
<rect class="out" x="163.2" y="96" width="351.9" height="24" rx="4"><title>out: stopped, fenced or handed over: +0 s to +621 s</title></rect>
<text class="in dim" x="169.2" y="112">out</text>
