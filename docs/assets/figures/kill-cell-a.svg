<rect class="switching" x="222.5" y="134" width="25.9" height="24" rx="4"><title>switching over: +104 s to +153 s</title></rect>
<rect class="both" x="250.4" y="134" width="462.4" height="24" rx="4"><title>both regions' customers: +153 s to +968 s</title></rect>
<text class="in" x="256.4" y="150">both regions</text>
<rect class="own" x="714.8" y="134" width="20.2" height="24" rx="4"><title>its own customers: +968 s to +1007 s</title></rect>
<line class="mark" x1="249.4" x2="249.4" y1="80" y2="158"/>
<text class="lab" x="254.4" y="76" text-anchor="start">took over at 2:33</text>
