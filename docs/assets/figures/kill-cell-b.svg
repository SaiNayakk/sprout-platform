<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" class="viz" role="img" aria-label="Region B stopped; the other region served its customers, then handed them back">
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
         --own:#2a78d6; --both:#eb6834; --switching:#1baf7a; --out:#c3c2b7; --peak:#c3c2b7; --demo:#2a78d6;
         --on-fill:#ffffff; --on-out:#0b0b0b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#2c2c2a; --axis:#383835;
           --own:#3987e5; --both:#d95926; --switching:#199e70; --out:#52514e; --peak:#6d6c67; --demo:#3987e5; --on-out:#f0efec; }
  }
  .bg { fill: var(--surface); }
  .t1 { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .t2 { fill: var(--ink2); font-size: 12.5px; }
  .lab { fill: var(--ink2); font-size: 12px; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .mark { stroke: var(--ink2); stroke-width: 1; }
  .in { fill: var(--on-fill); font-size: 11px; font-weight: 600; }
  .in.dim { fill: var(--on-out); font-weight: 500; }
  .own { fill: var(--own); } .both { fill: var(--both); } .switching { fill: var(--switching); } .out { fill: var(--out); }
  .peak { fill: var(--peak); stroke: var(--surface); stroke-width: 2; }
  .demo { fill: var(--demo); stroke: var(--surface); stroke-width: 2; }
  .link { stroke: var(--axis); stroke-width: 2; stroke-linecap: round; }
</style>
<rect class="bg" width="760" height="254" rx="8"/>
<text class="t1" x="128" y="28">Region B stopped: the other region took its customers, then gave them back</text>
<text class="t2" x="128" y="48">Orders worked again after 336 s. 759 orders acknowledged during the run: 0 lost, 0 applied twice.</text>
<line class="grid" x1="174.7" x2="174.7" y1="92" y2="158"/>
<text class="tick" x="174.7" y="178" text-anchor="middle">stopped</text>
<line class="grid" x1="268.1" x2="268.1" y1="92" y2="158"/>
<text class="tick" x="268.1" y="178" text-anchor="middle">+2 min</text>
<line class="grid" x1="361.5" x2="361.5" y1="92" y2="158"/>
<text class="tick" x="361.5" y="178" text-anchor="middle">+4 min</text>
<line class="grid" x1="455.0" x2="455.0" y1="92" y2="158"/>
<text class="tick" x="455.0" y="178" text-anchor="middle">+6 min</text>
<line class="grid" x1="548.4" x2="548.4" y1="92" y2="158"/>
<text class="tick" x="548.4" y="178" text-anchor="middle">+8 min</text>
<line class="grid" x1="641.8" x2="641.8" y1="92" y2="158"/>
<text class="tick" x="641.8" y="178" text-anchor="middle">+10 min</text>
<line class="grid" x1="735.2" x2="735.2" y1="92" y2="158"/>
<text class="tick" x="735.2" y="178" text-anchor="middle">+12 min</text>
<line class="axis" x1="128" x2="736" y1="164" y2="164"/>
<text class="lab" x="118" y="112" text-anchor="end">Region A (phone)</text>
<rect class="own" x="129.0" y="96" width="118.7" height="24" rx="4"><title>its own customers: -60 s to +95 s</title></rect>
<text class="in" x="135.0" y="112">own customers</text>
<rect class="switching" x="249.7" y="96" width="181.7" height="24" rx="4"><title>switching over: +95 s to +331 s</title></rect>
<text class="in" x="255.7" y="112">switching</text>
<rect class="both" x="433.4" y="96" width="273.6" height="24" rx="4"><title>both regions' customers: +331 s to +685 s</title></rect>
<text class="in" x="439.4" y="112">both regions</text>
<rect class="own" x="709.0" y="96" width="26.0" height="24" rx="4"><title>its own customers: +685 s to +721 s</title></rect>
<text class="lab" x="118" y="150" text-anchor="end">Region B (laptop)</text>
<rect class="own" x="129.0" y="134" width="44.7" height="24" rx="4"><title>its own customers: -60 s to +0 s</title></rect>
<rect class="out" x="175.7" y="134" width="282.1" height="24" rx="4"><title>out: stopped, fenced or handed over: +0 s to +365 s</title></rect>
<text class="in dim" x="181.7" y="150">out</text>
<rect class="own" x="459.9" y="134" width="7.3" height="24" rx="4"><title>its own customers: +365 s to +377 s</title></rect>
<rect class="out" x="469.2" y="134" width="169.3" height="24" rx="4"><title>out: stopped, fenced or handed over: +377 s to +597 s</title></rect>
<text class="in dim" x="475.2" y="150">out</text>
<rect class="switching" x="640.5" y="134" width="56.4" height="24" rx="4"><title>switching over: +597 s to +672 s</title></rect>
<rect class="own" x="698.9" y="134" width="36.1" height="24" rx="4"><title>its own customers: +672 s to +721 s</title></rect>
<line class="mark" x1="432.4" x2="432.4" y1="80" y2="158"/>
<text class="lab" x="437.4" y="76" text-anchor="start">took over at 5:31</text>
<line class="mark" x1="708.0" x2="708.0" y1="80" y2="158"/>
<text class="lab" x="703.0" y="76" text-anchor="end">handed back at 11:25</text>
<rect class="own" x="128" y="208" width="12" height="12" rx="3"/><text class="lab" x="145" y="218">its own customers</text>
<rect class="both" x="277.24" y="208" width="12" height="12" rx="3"/><text class="lab" x="294.24" y="218">both regions' customers</text>
<rect class="switching" x="466.8" y="208" width="12" height="12" rx="3"/><text class="lab" x="483.8" y="218">switching over</text>
<rect class="out" x="128" y="226" width="12" height="12" rx="3"/><text class="lab" x="145" y="236">out: stopped, fenced or handed over</text>
</svg>